[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hugo-listmonk-sync"
version = "1.0.0"
description = "Synchronize a Hugo newsletter JSON feed with Listmonk draft campaigns"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx==0.28.1",
  "markdownify==1.2.3",
]

[project.scripts]
hugo-listmonk-sync = "hugo_listmonk_sync.main:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hugo_listmonk_sync"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hugo_listmonk_sync"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
  "D107",
  "EM101",
  "EM102",
  "FBT001",
  "FBT003",
  "TC001",
  "TC003",
  "TRY003",
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "D",
  "PLR2004",
  "S101",
  "SLF001",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unreachable = true
